<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4;
            color: #1e293b;
            padding: 40px 15px;
        }
        .card {
            background-color: white;
            border: 1px solid #dcfce7;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            max-width: 480px;
            margin: auto;
        }
        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }
        .content {
            padding: 25px 30px;
        }
        .content h2 {
            font-size: 22px;
            color: #15803d;
            margin-bottom: 15px;
        }
        .content p {
            font-size: 14.5px;
            color: #475569;
            line-height: 1.8;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            margin-top: 10px;
        }
        .present { color: #15803d; background-color: #dcfce7; }
        .absent { color: #dc2626; background-color: #fee2e2; }

        .back-btn {
            display: block;
            text-align: center;
            background-color: #16a34a;
            color: white;
            padding: 10px;
            margin-top: 20px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover { background-color: #15803d; }
    </style>
</head>
<body>
    <div class="card">
        <img src="{{ std[6] if std[6] else 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400' }}" alt="Student Image">
        <div class="content">
            <h2>{{ std[1] }}</h2>
            <p><strong>Student ID:</strong> {{ std[0] }}</p>
            <p><strong>Age:</strong> {{ std[2] }}</p>
            <p><strong>Gender:</strong> {{ std[3] }}</p>
            <p><strong>Marks:</strong> {{ std[4] }}</p>
            <p><strong>Course:</strong> {{ std[5] }}</p>

            <div>
                {% if std[7] == 1 %}
                <span class="badge present">Present</span>
                {% else %}
                <span class="badge absent">Absent</span>
                {% endif %}
            </div>

            <a href="/" class="back-btn">Back to Home</a>
        </div>
    </div>
</body>
</html>
